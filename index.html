<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mosoptika</title>
    <script>
      // Инициализация темы до загрузки React
      (function() {
        // Принудительно устанавливаем светлую тему
        document.documentElement.classList.remove('dark');
        // Если пользователь явно выбрал темную тему, применяем её
        const theme = localStorage.getItem('crm-theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          // Для всех остальных случаев - светлая тема
          localStorage.setItem('crm-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
