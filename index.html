<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mosoptika</title>
    <script src="/build-cache-reset.js"></script>
    <script>
      // Инициализация темы до загрузки React
      (function() {
        // Принудительно устанавливаем светлую тему
        document.documentElement.classList.remove('dark');
        // Если пользователь явно выбрал темную тему, применяем её
        const theme = localStorage.getItem('crm-theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          // Для всех остальных случаев - светлая тема
          localStorage.setItem('crm-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div
        id="crm-boot-splash"
        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#64748b;background:#f8fafc"
      >
        <div
          style="width:32px;height:32px;border:2px solid #cbd5e1;border-top-color:#3b82f6;border-radius:50%;animation:crm-spin 0.8s linear infinite"
        ></div>
        <span>Загрузка Mosoptika…</span>
      </div>
    </div>
    <style>
      @keyframes crm-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
